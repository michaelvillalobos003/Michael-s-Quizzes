<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up • Michael's Quizzes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full rounded-3xl bg-slate-900 border border-slate-800 p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-indigo-600/10 rounded-full blur-2xl pointer-events-none"></div>

    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-2xl mx-auto mb-3">
        ✨
      </div>
      <h1 class="text-2xl font-bold text-white">Sign Up to Play</h1>
      <p class="text-slate-400 text-xs mt-1">Create a player profile to track scores and rewards.</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Choose a Username</label>
        <input
          type="text"
          id="username-input"
          required
          placeholder="Choose a username"
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
        <input
          type="email"
          id="email-input"
          placeholder="name@example.com"
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all active:scale-95"
      >
        Create Account & Continue
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('redirect') ? decodeURIComponent(urlParams.get('redirect')) : '/index.html';

    async function handleSignup(username, email) {
      try {
        const res = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email })
        });
        const data = await res.json();
        if (data.success && data.user) {
          localStorage.setItem('quiz_user', JSON.stringify(data.user));
          window.location.href = returnUrl;
        } else {
          alert('Sign-up failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Could not create your account. Please try again when the server is available.');
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username-input').value.trim();
      const em = document.getElementById('email-input').value.trim();
      handleSignup(u, em);
    });
  </script>
</body>
</html>
